<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Runner - Mobile Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* หน้าต่างกล้องหลัก */
        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* พื้นหลังสนามแบบ CSS Grid Pattern (ไม่ต้องโหลดรูปนอก) */
        #game-arena {
            position: absolute;
            width: 1600px;
            height: 1600px;
            background-color: #15803d; /* สีทุ่งหญ้า */
            background-image: 
                radial-gradient(#22c55e 15%, transparent 16%),
                radial-gradient(#16a34a 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            border: 8px solid #f59e0b;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            transition: transform 0.05s linear;
        }

        /* จอยสติ๊ก */
        .joystick-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            touch-action: none;
            z-index: 40;
        }

        .joystick-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            margin-top: -30px;
            margin-left: -30px;
            background: #22c55e;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            touch-action: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <!-- ลานประลอง (Arena) -->
        <div id="game-arena">
            <!-- เลเยอร์คำตอบ -->
            <div id="answers-layer"></div>
            <!-- เลเยอร์ผู้เล่น -->
            <div id="players-layer"></div>
        </div>

        <!-- UI ด้านบน (คะแนน & ชื่อ) -->
        <div class="absolute top-4 left-4 right-4 z-30 flex justify-between items-center bg-white/95 backdrop-blur p-3 rounded-2xl shadow-xl border-2 border-yellow-400">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🐹</span>
                <div>
                    <div id="display-name" class="font-bold text-slate-800 text-base leading-tight">น้อง548</div>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">🎮 Controller Active</span>
                </div>
            </div>
            <div class="bg-yellow-400 text-slate-900 px-4 py-1.5 rounded-xl text-center font-black shadow">
                <div class="text-[10px] uppercase tracking-wider text-slate-800">คะแนน</div>
                <div id="my-score" class="text-2xl leading-none">0</div>
            </div>
        </div>

        <!-- ข้อความคำแนะนำ (พร้อมปุ่มปิด) -->
        <div id="instruction-box" class="absolute top-28 left-6 right-6 z-30 bg-white p-4 rounded-2xl shadow-2xl border-4 border-yellow-400 text-center transition-all duration-300">
            <p class="text-slate-800 font-bold text-sm mb-3">
                🌱 เลื่อนจอยสติ๊กด้านล่าง เพื่อบังคับตัวละครวิ่งไปหาคำตอบบนสนามครับ!
            </p>
            <button onclick="dismissInstruction()" class="bg-yellow-400 hover:bg-yellow-500 active:scale-95 text-slate-900 font-bold text-xs px-5 py-2 rounded-xl shadow">
                เข้าใจแล้ว (เริ่มเล่น)
            </button>
        </div>

        <!-- จอยสติ๊กบังคับ -->
        <div class="joystick-container" id="joy-base">
            <div class="joystick-handle" id="joy-handle"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://multiplayer-math-game-e021c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multiplayer-math-game-e021c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ขนาดสนาม
        const ARENA_SIZE = 1600;
        let posX = 800; // จุดเริ่มต้นกลางสนาม
        let posY = 800;
        let playerId = 'player_' + Math.floor(Math.random() * 1000);
        let myScore = 0;

        const arena = document.getElementById('game-arena');
        const playersLayer = document.getElementById('players-layer');
        const answersLayer = document.getElementById('answers-layer');
        const instructionBox = document.getElementById('instruction-box');

        // ฟังก์ชันลบคำแนะนำ
        function dismissInstruction() {
            if (instructionBox) {
                instructionBox.style.opacity = '0';
                instructionBox.style.transform = 'scale(0.9)';
                setTimeout(() => instructionBox.remove(), 300);
            }
        }

        // อัปเดตกล้องตามตัวละครให้อยู่กลางจอ
        function updateCamera() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            let camX = (vw / 2) - posX;
            let camY = (vh / 2) - posY;

            // จำกัดไม่ให้กล้องหลุดขอบสนาม
            camX = Math.min(0, Math.max(camX, vw - ARENA_SIZE));
            camY = Math.min(0, Math.max(camY, vh - ARENA_SIZE));

            arena.style.transform = `translate(${camX}px, ${camY}px)`;
        }

        // วาดตัวละครตัวเอง
        function renderSelf() {
            playersLayer.innerHTML = `
                <div class="absolute flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2 transition-all duration-75"
                     style="left: ${posX}px; top: ${posY}px;">
                    <div class="w-12 h-12 bg-yellow-400 border-4 border-white rounded-full flex items-center justify-center text-2xl shadow-lg ring-4 ring-black/20">
                        🐹
                    </div>
                    <span class="bg-slate-900/90 text-yellow-300 font-bold text-xs px-2 py-0.5 rounded-full mt-1 shadow border border-slate-700 whitespace-nowrap">
                        คุณ (น้อง548)
                    </span>
                </div>
            `;
            updateCamera();
        }

        // สุ่มวางคำตอบตัวอย่างบนสนาม
        function renderSampleAnswers() {
            const sampleAnswers = [
                { val: 13, x: 400, y: 400 },
                { val: 17, x: 1200, y: 400 },
                { val: 11, x: 400, y: 1200 },
                { val: 6, x: 1200, y: 1200 }
            ];

            answersLayer.innerHTML = sampleAnswers.map(ans => `
                <div class="absolute bg-white/95 text-slate-900 border-4 border-yellow-400 font-black text-2xl w-16 h-16 rounded-2xl flex items-center justify-center shadow-2xl transform -translate-x-1/2 -translate-y-1/2"
                     style="left: ${ans.x}px; top: ${ans.y}px;">
                    ${ans.val}
                </div>
            `).join('');
        }

        // --- ระบบ Joystick Touch Controls ---
        const joyBase = document.getElementById('joy-base');
        const joyHandle = document.getElementById('joy-handle');
        let isTouching = false;
        let startX, startY;
        const maxRadius = 40;

        joyBase.addEventListener('touchstart', (e) => {
            isTouching = true;
            dismissInstruction();
            const touch = e.touches[0];
            const rect = joyBase.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const touch = e.touches[0];
            const deltaX = touch.clientX - startX;
            const deltaY = touch.clientY - startY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            const angle = Math.atan2(deltaY, deltaX);
            const moveDist = Math.min(distance, maxRadius);

            const handleX = Math.cos(angle) * moveDist;
            const handleY = Math.sin(angle) * moveDist;

            joyHandle.style.transform = `translate(${handleX}px, ${handleY}px)`;

            // เคลื่อนที่ตัวละคร
            const moveSpeed = 12;
            posX += Math.cos(angle) * (moveDist / maxRadius) * moveSpeed;
            posY += Math.sin(angle) * (moveDist / maxRadius) * moveSpeed;

            // ชนขอบสนาม
            posX = Math.max(40, Math.min(ARENA_SIZE - 40, posX));
            posY = Math.max(40, Math.min(ARENA_SIZE - 40, posY));

            renderSelf();
        });

        document.addEventListener('touchend', () => {
            isTouching = false;
            joyHandle.style.transform = `translate(0px, 0px)`;
        });

        // เริ่มต้นทำงาน
        renderSelf();
        renderSampleAnswers();
        window.addEventListener('resize', updateCamera);
    </script>
</body>
</html>
