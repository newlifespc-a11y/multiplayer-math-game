<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Runner - Player Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        /* สไตล์ปุ่มจอยสติ๊กการ์ตูนสดใส */
        .joystick-base {
            background: radial-gradient(circle, #fef08a 0%, #fde047 100%);
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.4), inset 0 4px 8px rgba(255,255,255,0.8);
        }
        .joystick-handle {
            background: radial-gradient(circle, #ff7e5f 0%, #feb47b 100%);
            box-shadow: 0 8px 15px rgba(239, 68, 68, 0.4), inset 0 2px 5px rgba(255,255,255,0.9);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-400 via-sky-200 to-emerald-200 h-screen flex flex-col justify-between p-4 font-sans overflow-hidden">

    <!-- Top Info Bar -->
    <div class="bg-white/90 backdrop-blur-md border-4 border-amber-300 rounded-3xl p-3 shadow-xl flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div id="player-avatar" class="text-4xl bg-amber-100 p-2 rounded-2xl border-2 border-amber-300 shadow-inner">
                🐯
            </div>
            <div>
                <div id="player-name" class="font-black text-slate-800 text-lg leading-tight">กำลังเข้าสู่เกม...</div>
                <div class="text-xs font-bold text-sky-600 bg-sky-100 px-2 py-0.5 rounded-full inline-block mt-0.5">🎮 ปุ่มควบคุม</div>
            </div>
        </div>
        <div class="bg-gradient-to-r from-amber-400 to-orange-400 text-white font-black px-4 py-2 rounded-2xl shadow-md border-2 border-white flex flex-col items-center">
            <span class="text-[10px] uppercase opacity-90">คะแนน</span>
            <span id="player-score" class="text-xl">0</span>
        </div>
    </div>

    <!-- Center Guidance Status -->
    <div class="my-auto text-center px-4">
        <div id="status-card" class="bg-white/80 backdrop-blur-sm rounded-3xl p-4 border-2 border-sky-300 shadow-lg inline-block">
            <p id="game-status-text" class="text-base font-black text-sky-800">
                🌱 บังคับตัวละครวิจัยหาคำตอบบนจอนะครับ!
            </p>
        </div>
    </div>

    <!-- Bottom Virtual Joystick Zone -->
    <div class="flex justify-center items-center pb-6">
        <div id="joystick-container" class="joystick-base w-48 h-48 rounded-full border-4 border-white relative flex justify-center items-center">
            <div id="joystick-handle" class="joystick-handle w-20 h-20 rounded-full border-4 border-white absolute transition-transform duration-75 flex items-center justify-center text-white text-2xl font-black">
                ✨
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://multiplayer-math-game-e021c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multiplayer-math-game-e021c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = localStorage.getItem('math_runner_player_id');
        const avatars = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵'];
        
        if (!playerId) {
            playerId = 'p_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('math_runner_player_id', playerId);
        }

        const randomAvatar = avatars[Math.floor(Math.random() * avatars.length)];
        const defaultName = "น้อง" + Math.floor(100 + Math.random() * 900);

        let myData = {
            x: 50,
            y: 50,
            score: 0,
            avatar: randomAvatar,
            name: defaultName
        };

        const playerRef = db.ref('players/' + playerId);

        playerRef.once('value').then(snapshot => {
            if (snapshot.exists()) {
                myData = snapshot.val();
            } else {
                playerRef.set(myData);
            }
            updatePlayerUI();
        });

        playerRef.on('value', snapshot => {
            if (snapshot.exists()) {
                myData = snapshot.val();
                updatePlayerUI();
            }
        });

        function updatePlayerUI() {
            document.getElementById('player-avatar').innerText = myData.avatar || '🐯';
            document.getElementById('player-name').innerText = myData.name || 'ผู้เล่น';
            document.getElementById('player-score').innerText = myData.score || 0;
        }

        // Joystick Logic
        const container = document.getElementById('joystick-container');
        const handle = document.getElementById('joystick-handle');

        let isDragging = false;
        let centerX, centerY;
        const maxDistance = 60; 

        function handleStart(e) {
            isDragging = true;
            const rect = container.getBoundingClientRect();
            centerX = rect.left + rect.width / 2;
            centerY = rect.top + rect.height / 2;
            moveJoystick(e);
        }

        function handleMove(e) {
            if (!isDragging) return;
            moveJoystick(e);
        }

        function handleEnd() {
            isDragging = false;
            handle.style.transform = `translate(0px, 0px)`;
        }

        function moveJoystick(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);

            if (distance > maxDistance) {
                deltaX = (deltaX / distance) * maxDistance;
                deltaY = (deltaY / distance) * maxDistance;
            }

            handle.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // Convert movement to map percentage (Speed factor)
            const speed = 1.2;
            let newX = myData.x + (deltaX / maxDistance) * speed;
            let newY = myData.y + (deltaY / maxDistance) * speed;

            newX = Math.max(5, Math.min(95, newX));
            newY = Math.max(10, Math.min(90, newY));

            myData.x = newX;
            myData.y = newY;

            playerRef.update({ x: newX, y: newY });
        }

        container.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        container.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
    </script>
</body>
</html>
