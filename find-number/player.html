<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Runner - Mobile Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
        
        #game-arena {
            position: absolute; width: 1000px; height: 1000px;
            background-color: #15803d;
            background-image: 
                radial-gradient(#22c55e 15%, transparent 16%),
                radial-gradient(#16a34a 15%, transparent 16%);
            background-size: 40px 40px;
            border: 8px solid #f59e0b;
        }

        .joystick-container {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; touch-action: none; z-index: 40;
        }

        .joystick-handle {
            position: absolute; top: 50%; left: 50%;
            width: 60px; height: 60px; margin-top: -30px; margin-left: -30px;
            background: #22c55e; border: 3px solid #ffffff;
            border-radius: 50%; touch-action: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport" class="relative w-full h-full overflow-hidden">
        <!-- Arena -->
        <div id="game-arena">
            <div id="answers-layer"></div>
            <div id="players-layer"></div>
        </div>

        <!-- Header -->
        <div id="hud" class="hidden absolute top-3 left-3 right-3 z-30 flex justify-between items-center bg-white/95 backdrop-blur p-2.5 rounded-2xl shadow-xl border-2 border-yellow-400">
            <div class="flex items-center gap-2">
                <span id="my-avatar" class="text-3xl">🐹</span>
                <div>
                    <div id="display-name" class="font-bold text-slate-800 text-sm leading-tight">...</div>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">🎮 Controller Active</span>
                </div>
            </div>
            <div class="bg-yellow-400 text-slate-900 px-4 py-1 rounded-xl text-center font-black shadow">
                <div class="text-[9px] uppercase tracking-wider">คะแนน</div>
                <div id="my-score" class="text-xl leading-none">0/10</div>
            </div>
        </div>

        <!-- Question Box -->
        <div id="question-box" class="hidden absolute top-20 left-6 right-6 z-30 bg-slate-900/90 text-white p-3 rounded-2xl shadow-2xl border-2 border-cyan-400 text-center backdrop-blur">
            <div class="text-[10px] text-cyan-300 font-bold uppercase">โจทย์คณิตคิดเร็ว</div>
            <div id="question-text" class="text-2xl font-black text-yellow-300">รอโจทย์จากโฮสต์...</div>
        </div>

        <!-- Login Box -->
        <div id="login-screen" class="absolute inset-0 z-50 flex flex-col justify-center items-center p-4 bg-slate-900/95">
            <div class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl border-4 border-yellow-400 text-center shadow-2xl">
                <h2 class="text-2xl font-black text-yellow-400 mb-1">🏃 Math Runner</h2>
                <p class="text-xs text-slate-400 mb-4">ใส่ชื่อเพื่อเข้าร่วมลานประลอง</p>
                <input type="text" id="player-name" placeholder="ชื่อของคุณ..." class="w-full p-3 rounded-xl bg-slate-900 border-2 border-slate-600 text-center text-white font-bold text-lg mb-4 focus:border-yellow-400 focus:outline-none">
                <button onclick="joinGame()" class="w-full bg-yellow-400 hover:bg-yellow-500 active:scale-95 text-slate-900 font-black py-3 rounded-xl shadow-lg transition text-base">
                    เข้าร่วมแข่งขัน
                </button>
            </div>
        </div>

        <!-- Game Over Modal on Mobile -->
        <div id="mobile-winner-screen" class="hidden absolute inset-0 z-50 bg-slate-950/95 flex flex-col justify-center items-center p-6 text-center">
            <div class="text-6xl mb-2" id="m-win-icon">🎉</div>
            <h2 id="m-win-title" class="text-3xl font-black text-yellow-400 mb-2">จบการแข่งขัน!</h2>
            <div id="m-win-detail" class="text-lg text-slate-200 font-bold mb-6">...</div>
            <p class="text-xs text-slate-400">รอโฮสต์กดเริ่มเกมรอบถัดไป...</p>
        </div>

        <!-- Joystick -->
        <div class="joystick-container hidden" id="joy-base">
            <div class="joystick-handle" id="joy-handle"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://multiplayer-math-game-e021c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multiplayer-math-game-e021c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        let posX = 50; 
        let posY = 50;
        const avatars = ['🐹', '🦊', '🐱', '🐶', '🦁', '🐸'];
        const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4'];

        function joinGame() {
            const name = document.getElementById('player-name').value.trim();
            if(!name) { alert('กรุณาใส่ชื่อก่อนครับ'); return; }

            playerId = 'p_' + Math.random().toString(36).substr(2, 7);
            const myAvatar = avatars[Math.floor(Math.random() * avatars.length)];

            db.ref('players/' + playerId).set({
                name: name,
                score: 0,
                x: 50,
                y: 50,
                avatar: myAvatar
            }).then(() => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('question-box').classList.remove('hidden');
                document.getElementById('joy-base').classList.remove('hidden');

                document.getElementById('display-name').innerText = name;
                document.getElementById('my-avatar').innerText = myAvatar;

                db.ref('players/' + playerId).onDisconnect().remove();

                listenGameState();
                listenPlayers();
            }).catch(err => alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err.message));
        }

        function listenGameState() {
            db.ref('gameState/currentQuestion').on('value', (snapshot) => {
                const q = snapshot.val();
                if(q) {
                    document.getElementById('question-text').innerText = `${q.n1} + ${q.n2} = ?`;
                    renderAnswersOnMobile(q.options);
                } else {
                    document.getElementById('question-text').innerText = "รอโจทย์จากโฮสต์...";
                    document.getElementById('answers-layer').innerHTML = "";
                }
            });

            db.ref('gameState/winner').on('value', (snapshot) => {
                const winner = snapshot.val();
                const modal = document.getElementById('mobile-winner-screen');
                if (winner) {
                    modal.classList.remove('hidden');
                    if (winner.id === playerId) {
                        document.getElementById('m-win-icon').innerText = "🏆";
                        document.getElementById('m-win-title').innerText = "คุณคือผู้ชนะ!";
                        document.getElementById('m-win-detail').innerText = "ยินดีด้วย! คุณทำครบ 10 คะแนนเป็นคนแรก";
                    } else {
                        document.getElementById('m-win-icon').innerText = "🏁";
                        document.getElementById('m-win-title').innerText = "จบการแข่งขัน!";
                        document.getElementById('m-win-detail').innerText = `${winner.avatar} ${winner.name} ได้ 10 คะแนนก่อน!`;
                    }
                } else {
                    modal.classList.add('hidden');
                }
            });
        }

        function renderAnswersOnMobile(options) {
            const layer = document.getElementById('answers-layer');
            if(!options) return;

            layer.innerHTML = options.map((opt) => `
                <div class="absolute bg-white text-slate-900 border-4 border-yellow-400 font-black text-2xl w-16 h-16 rounded-2xl flex items-center justify-center shadow-2xl transform -translate-x-1/2 -translate-y-1/2 z-0 transition-all duration-300"
                     style="left: ${opt.x * 10}px; top: ${opt.y * 10}px;">
                    ${opt.val}
                </div>
            `).join('');
        }

        function listenPlayers() {
            db.ref('players').on('value', (snapshot) => {
                const players = snapshot.val() || {};
                const container = document.getElementById('players-layer');
                const keys = Object.keys(players);

                if (playerId && !players[playerId]) {
                    location.reload();
                    return;
                }

                if (players[playerId]) {
                    document.getElementById('my-score').innerText = `${players[playerId].score || 0}/10`;
                    posX = players[playerId].x || 50;
                    posY = players[playerId].y || 50;
                }

                container.innerHTML = keys.map((id, index) => {
                    const p = players[id];
                    const color = colors[index % colors.length];
                    const isMe = id === playerId;

                    return `
                    <div class="absolute flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2 z-10 transition-all duration-75"
                         style="left: ${(p.x || 50) * 10}px; top: ${(p.y || 50) * 10}px;">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-lg border-2 ${isMe ? 'border-yellow-300 ring-4 ring-yellow-400/50' : 'border-white'}"
                             style="background-color: ${color}">
                            ${p.avatar || '🐹'}
                        </div>
                        <span class="mt-1 text-[10px] font-bold ${isMe ? 'bg-yellow-400 text-slate-900' : 'bg-slate-900/90 text-white'} px-2 py-0.5 rounded-full shadow border border-slate-700 whitespace-nowrap">
                            ${p.name}
                        </span>
                    </div>`;
                }).join('');

                updateCamera();
            });
        }

        function updateCamera() {
            const arena = document.getElementById('game-arena');
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            const px = posX * 10;
            const py = posY * 10;

            let camX = (vw / 2) - px;
            let camY = (vh / 2) - py;

            camX = Math.min(0, Math.max(camX, vw - 1000));
            camY = Math.min(0, Math.max(camY, vh - 1000));

            arena.style.transform = `translate(${camX}px, ${camY}px)`;
        }

        // Joystick Control
        const joyBase = document.getElementById('joy-base');
        const joyHandle = document.getElementById('joy-handle');
        let isTouching = false, startX, startY;

        joyBase.addEventListener('touchstart', (e) => {
            isTouching = true;
            const touch = e.touches[0];
            const rect = joyBase.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isTouching || !playerId) return;
            const touch = e.touches[0];
            const deltaX = touch.clientX - startX;
            const deltaY = touch.clientY - startY;
            const dist = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY), 40);
            const angle = Math.atan2(deltaY, deltaX);

            joyHandle.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;

            posX += Math.cos(angle) * (dist / 40) * 1.2;
            posY += Math.sin(angle) * (dist / 40) * 1.2;
            posX = Math.max(5, Math.min(95, posX));
            posY = Math.max(5, Math.min(95, posY));

            db.ref('players/' + playerId).update({ x: posX, y: posY });
        });

        document.addEventListener('touchend', () => {
            isTouching = false;
            joyHandle.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
