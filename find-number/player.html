<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Runner - Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }
        .arena-sky {
            background-color: #bae6fd; /* สีฟ้าอ่อน */
            background-image: radial-gradient(#0284c7 1px, transparent 1px);
            background-size: 16px 16px;
        }
        /* Style สำหรับ วงกลม Joystick */
        #joystick-base {
            width: 130px;
            height: 130px;
            background: rgba(30, 41, 59, 0.7);
            border: 3px solid #38bdf8;
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        #joystick-stick {
            width: 50px;
            height: 50px;
            background: #f59e0b;
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="p-3 bg-slate-800 flex justify-between items-center border-b border-slate-700">
        <h1 class="text-sm font-bold text-yellow-400">🏃 ลานประลองสีฟ้า</h1>
        <span id="player-name-tag" class="text-xs bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-full font-bold">
            กำลังสร้างตัวละคร...
        </span>
    </header>

    <!-- Main View: Light Blue Arena -->
    <div class="flex-1 p-3 flex flex-col relative overflow-hidden">
        
        <!-- Light Blue Arena Container -->
        <div class="flex-1 arena-sky rounded-xl relative border-2 border-sky-400 overflow-hidden shadow-inner">
            <div id="players-layer" class="w-full h-full relative">
                <!-- Dynamic Players Render Here -->
            </div>
        </div>

        <!-- Floating Circular Joystick at Bottom Right (วงกลมขวาล่าง) -->
        <div class="absolute bottom-6 right-6 z-50 flex flex-col items-center">
            <div id="joystick-base" class="shadow-2xl">
                <div id="joystick-stick"></div>
            </div>
        </div>
    </div>

    <!-- Firebase & Joystick Logic -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://multiplayer-math-game-e021c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multiplayer-math-game-e021c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        let myName = "Player_" + Math.floor(1000 + Math.random() * 9000);
        let posX = Math.floor(Math.random() * 60) + 20; // Random Start Pos X (20%-80%)
        let posY = Math.floor(Math.random() * 60) + 20; // Random Start Pos Y (20%-80%)
        let allPlayers = {};
        const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4', '#10B981'];

        // Auto Join when Scanning
        function autoCreatePlayer() {
            playerId = 'player_' + Math.random().toString(36).substr(2, 9);
            const playerRef = db.ref('players/' + playerId);

            playerRef.set({
                name: myName,
                x: posX,
                y: posY
            });

            playerRef.onDisconnect().remove();

            document.getElementById('player-name-tag').innerText = "คุณคือ: " + myName;

            // Listen for All Players Realtime Position
            db.ref('players').on('value', (snapshot) => {
                allPlayers = snapshot.val() || {};
                renderArena();
            });
        }

        function renderArena() {
            const container = document.getElementById('players-layer');
            const keys = Object.keys(allPlayers);

            container.innerHTML = keys.map((id, index) => {
                const p = allPlayers[id];
                const color = colors[index % colors.length];
                const x = p.x !== undefined ? p.x : 50;
                const y = p.y !== undefined ? p.y : 50;
                const isMe = id === playerId;

                return `
                <div class="absolute transition-all duration-75 ease-out flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2" 
                     style="left: ${x}%; top: ${y}%;">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-md border ${isMe ? 'border-yellow-300 ring-4 ring-yellow-400/50 scale-110' : 'border-white'}" 
                         style="background-color: ${color}">
                        🏃
                    </div>
                    <span class="text-[9px] font-bold ${isMe ? 'bg-yellow-400 text-slate-900' : 'bg-slate-900/80 text-white'} px-1 rounded whitespace-nowrap">
                        ${p.name}
                    </span>
                </div>`;
            }).join('');
        }

        // --- Circular Joystick Logic ---
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        let isDragging = false;
        let moveInterval = null;
        let deltaX = 0;
        let deltaY = 0;

        const maxRadius = 40; // Max stick drag distance

        function handleStart(e) {
            isDragging = true;
            if (!moveInterval) {
                moveInterval = setInterval(updatePosition, 50); // Move every 50ms
            }
        }

        function handleMove(e) {
            if (!isDragging) return;

            const touch = e.touches ? e.touches[0] : e;
            const rect = base.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            // Normalized velocity vector (-1 to 1)
            deltaX = (dx / maxRadius) * 1.5;
            deltaY = (dy / maxRadius) * 1.5;
        }

        function handleEnd() {
            isDragging = false;
            stick.style.transform = `translate(-50%, -50%)`;
            deltaX = 0;
            deltaY = 0;
            clearInterval(moveInterval);
            moveInterval = null;
        }

        function updatePosition() {
            if (deltaX === 0 && deltaY === 0) return;

            posX = Math.min(Math.max(posX + deltaX, 3), 97);
            posY = Math.min(Math.max(posY + deltaY, 3), 97);

            if (playerId) {
                db.ref('players/' + playerId + '/x').set(posX);
                db.ref('players/' + playerId + '/y').set(posY);
            }
        }

        // Joystick Event Listeners
        base.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        base.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        // Auto initialization
        autoCreatePlayer();
    </script>
</body>
</html>
