<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Runner - Host Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans select-none">

    <!-- Header Section -->
    <header class="p-4 bg-slate-800 flex justify-between items-center border-b border-slate-700">
        <div>
            <h1 class="text-2xl font-bold text-yellow-400">🏃 Math Runner Grand Prix</h1>
            <p class="text-xs text-slate-400">สแกน QR Code แล้ววิ่งชนตัวเลขคำตอบที่ถูกต้องบนกระดาน!</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="startGame()" class="bg-emerald-500 hover:bg-emerald-600 px-5 py-2 rounded-lg font-bold text-white shadow transition text-sm">เริ่มเกม</button>
            <button onclick="resetGame()" class="bg-rose-600 hover:bg-rose-700 px-4 py-2 rounded-lg font-bold text-white shadow transition text-sm">รีเซ็ตเกม</button>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row p-4 gap-4">
        <!-- Sidebar: QR Code & Scoreboard -->
        <div class="w-full md:w-1/4 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center">
            <h2 class="text-lg font-bold mb-2 text-center text-cyan-400">สแกนเพื่อเล่นเกม</h2>
            <div id="qrcode" class="bg-white p-3 rounded-lg shadow-md mb-4"></div>
            
            <h3 class="font-semibold text-slate-300 w-full border-b border-slate-600 pb-1 mb-2">
                อันดับคะแนน (<span id="player-count">0</span> คน)
            </h3>
            <ul id="player-join-list" class="w-full flex-1 overflow-y-auto space-y-2 text-sm">
                <li class="text-slate-500 text-center italic py-4">กำลังรอผู้เล่นสแกน...</li>
            </ul>
        </div>

        <!-- Main Display View -->
        <div class="flex-1 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col">
            
            <!-- Question Box Display Header -->
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center mb-4 flex justify-between items-center px-6">
                <div class="text-left">
                    <span id="round-label" class="text-xs font-bold bg-yellow-500/20 text-yellow-300 border border-yellow-500/30 px-3 py-1 rounded-full">รอเริ่มเกม</span>
                </div>
                <div id="question-text" class="text-3xl font-black text-cyan-300 tracking-wider">
                    กด "เริ่มเกม" เพื่อเริ่มสุ่มโจทย์
                </div>
                <div id="game-status" class="text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full">
                    สถานะ: รอเริ่มต้น
                </div>
            </div>

            <!-- Solid Light Blue Arena Container -->
            <div id="arena-container" class="flex-1 bg-sky-200 rounded-xl relative border-4 border-sky-400 shadow-inner overflow-hidden min-h-[420px]">
                <!-- Target Options Layer -->
                <div id="options-layer" class="w-full h-full absolute inset-0"></div>
                <!-- Players Avatar Layer -->
                <div id="players-layer" class="w-full h-full absolute inset-0"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://multiplayer-math-game-e021c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multiplayer-math-game-e021c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playersData = {};
        let currentGameState = {};
        let isProcessingHit = false; // Flag ป้องกันการชนซ้ำรวดเดียว

        const playerUrl = "https://newlifespc-a11y.github.io/multiplayer-math-game/find-number/player.html";
        new QRCode(document.getElementById("qrcode"), { text: playerUrl, width: 140, height: 140 });

        // Listen for Realtime Players & Game State
        db.ref('players').on('value', (snapshot) => {
            playersData = snapshot.val() || {};
            renderPlayers();
            updateScoreboard();
            checkCollisions();
        });

        db.ref('gameState').on('value', (snapshot) => {
            currentGameState = snapshot.val() || {};
            updateUIState();
            renderOptions();
        });

        function updateUIState() {
            const qEl = document.getElementById('question-text');
            const roundEl = document.getElementById('round-label');
            const statusEl = document.getElementById('game-status');

            if (currentGameState.status === 'PLAYING') {
                qEl.innerText = currentGameState.question || "กำลังดึงโจทย์...";
                roundEl.innerText = `ข้อที่ ${currentGameState.currentRound || 1} / 5`;
                statusEl.innerText = "สถานะ: กำลังแข่งขัน 🔥";
                statusEl.className = "text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full";
            } else if (currentGameState.status === 'FINISHED') {
                qEl.innerText = "🏆 จบการแข่งขันแล้ว!";
                roundEl.innerText = "จบเกม";
                statusEl.innerText = "สถานะ: จบเกม";
                statusEl.className = "text-xs font-semibold bg-purple-500/20 text-purple-300 border border-purple-500/30 px-3 py-1 rounded-full";
            } else {
                qEl.innerText = 'กด "เริ่มเกม" เพื่อเริ่มสุ่มโจทย์';
                roundEl.innerText = 'รอเริ่มเกม';
                statusEl.innerText = "สถานะ: รอเริ่มต้น";
                statusEl.className = "text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full";
            }
        }

        function updateScoreboard() {
            const listEl = document.getElementById('player-join-list');
            const countEl = document.getElementById('player-count');
            const keys = Object.keys(playersData);
            countEl.innerText = keys.length;

            if (keys.length === 0) {
                listEl.innerHTML = '<li class="text-slate-500 text-center italic py-4">กำลังรอผู้เล่นสแกน...</li>';
                return;
            }

            const sortedKeys = keys.sort((a,b) => (playersData[b].score || 0) - (playersData[a].score || 0));

            listEl.innerHTML = sortedKeys.map((id, idx) => {
                const p = playersData[id];
                const pName = p.name || 'ผู้เล่น';
                return `<li class="flex items-center justify-between bg-slate-700/50 p-2 rounded border border-slate-600">
                    <span class="font-medium flex items-center gap-2">
                        <span class="text-xs bg-yellow-500 text-slate-900 font-bold px-1.5 py-0.5 rounded-full">#${idx+1}</span>
                        <span class="text-base">${p.avatar || '🐯'}</span>
                        ${pName}
                    </span>
                    <span class="text-xs font-bold text-yellow-400 bg-slate-800 px-2 py-1 rounded">คะแนน: ${p.score || 0}</span>
                </li>`;
            }).join('');
        }

        function renderPlayers() {
            const container = document.getElementById('players-layer');
            const keys = Object.keys(playersData);

            if (keys.length === 0) {
                container.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-slate-500 font-bold text-lg">ยังไม่มีผู้เล่นในสนาม</div>';
                return;
            }

            container.innerHTML = keys.map((id) => {
                const p = playersData[id];
                const pName = p.name || 'ผู้เล่น';
                const x = p.x !== undefined ? p.x : 50;
                const y = p.y !== undefined ? p.y : 50;

                return `
                <div class="absolute transition-all duration-75 ease-out flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2 z-20" 
                     style="left: ${x}%; top: ${y}%;">
                    <div class="text-3xl filter drop-shadow-md">
                        ${p.avatar || '🐯'}
                    </div>
                    <span class="text-[9px] font-medium bg-slate-900/80 text-white px-1.5 py-0.2 rounded shadow whitespace-nowrap">
                        ${pName} (${p.score || 0})
                    </span>
                </div>`;
            }).join('');
        }

        function renderOptions() {
            const container = document.getElementById('options-layer');
            if (currentGameState.status !== 'PLAYING' || !currentGameState.options) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = currentGameState.options.map((opt) => `
                <div class="absolute transform -translate-x-1/2 -translate-y-1/2 bg-white/95 border-2 border-sky-600 text-slate-900 font-black text-xl rounded-2xl w-14 h-14 flex items-center justify-center shadow-lg z-10"
                     style="left: ${opt.x}%; top: ${opt.y}%;">
                    ${opt.val}
                </div>
            `).join('');
        }

        function checkCollisions() {
            if (currentGameState.status !== 'PLAYING' || !currentGameState.options || isProcessingHit) return;

            const targetVal = currentGameState.correctAnswer;
            const targetOpt = currentGameState.options.find(o => o.val === targetVal);
            if (!targetOpt) return;

            Object.keys(playersData).forEach(pId => {
                if (isProcessingHit) return;
                const p = playersData[pId];
                const dist = Math.hypot(p.x - targetOpt.x, p.y - targetOpt.y);

                if (dist < 6) { 
                    isProcessingHit = true; // ล็อคไม่ให้ประมวลผลซ้ำ
                    let newScore = (p.score || 0) + 1;
                    
                    db.ref('players/' + pId + '/score').set(newScore);

                    let currentRound = currentGameState.currentRound || 1;
                    let nextRound = currentRound + 1;

                    if (nextRound > 5) {
                        db.ref('gameState').set({ status: 'FINISHED' });
                        isProcessingHit = false;
                    } else {
                        setTimeout(() => {
                            generateNextQuestion(nextRound);
                            isProcessingHit = false;
                        }, 300); // เว้นจังหวะ 0.3 วินาทีก่อนเปลี่ยนข้อ
                    }
                }
            });
        }

        function generateNextQuestion(roundNum) {
            const ops = ['+', '-', '*', '/'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let n1, n2, ans, qText;

            if (op === '+') {
                n1 = Math.floor(Math.random() * 10);
                n2 = Math.floor(Math.random() * 10);
                ans = n1 + n2;
                qText = `${n1} + ${n2} = ?`;
            } else if (op === '-') {
                n1 = Math.floor(Math.random() * 10);
                n2 = Math.floor(Math.random() * (n1 + 1));
                ans = n1 - n2;
                qText = `${n1} - ${n2} = ?`;
            } else if (op === '*') {
                n1 = Math.floor(Math.random() * 10);
                n2 = Math.floor(Math.random() * 10);
                ans = n1 * n2;
                qText = `${n1} × ${n2} = ?`;
            } else {
                n2 = Math.floor(Math.random() * 9) + 1;
                ans = Math.floor(Math.random() * 10);
                n1 = n2 * ans;
                qText = `${n1} ÷ ${n2} = ?`;
            }

            let choices = [ans];
            while (choices.length < 5) {
                let wrong = Math.floor(Math.random() * 20);
                if (!choices.includes(wrong)) choices.push(wrong);
            }
            choices.sort(() => Math.random() - 0.5);

            const positions = [
                { x: 20, y: 20 }, { x: 80, y: 20 },
                { x: 50, y: 50 },
                { x: 20, y: 80 }, { x: 80, y: 80 }
            ].sort(() => Math.random() - 0.5);

            const optionsData = choices.map((val, idx) => ({
                val: val,
                x: positions[idx].x,
                y: positions[idx].y
            }));

            db.ref('gameState').set({
                status: 'PLAYING',
                currentRound: roundNum,
                question: qText,
                correctAnswer: ans,
                options: optionsData
            });
        }

        function startGame() {
            isProcessingHit = false;
            // รีเซ็ตคะแนนผู้เล่นทุกคนเป็น 0
            Object.keys(playersData).forEach(pId => {
                db.ref('players/' + pId + '/score').set(0);
            });
            generateNextQuestion(1);
        }

        function resetGame() {
            if (confirm("ต้องการรีเซ็ตเกมและลบผู้เล่นทั้งหมดใช่หรือไม่?")) {
                isProcessingHit = false;
                db.ref('players').set({});
                db.ref('gameState').set({ status: 'WAITING' });
            }
        }
    </script>
</body>
</html>
