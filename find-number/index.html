<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Runner - Host Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .arena-sky {
            background-color: #bae6fd; /* สีฟ้าอ่อน */
            background-image: radial-gradient(#0284c7 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans select-none">

    <!-- Header Section -->
    <header class="p-4 bg-slate-800 flex justify-between items-center border-b border-slate-700">
        <div>
            <h1 class="text-2xl font-bold text-yellow-400">🏃 ลานประลองสีฟ้า (Host Area)</h1>
            <p class="text-xs text-slate-400">สแกน QR Code เพื่อสร้างตัวละครและลงสนามทันที</p>
        </div>
        <div>
            <button onclick="resetGame()" class="bg-rose-600 hover:bg-rose-700 px-4 py-2 rounded-lg font-bold text-white shadow transition text-sm">รีเซ็ตผู้เล่นทั้งหมด</button>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row p-4 gap-4">
        <!-- Sidebar: QR Code & Player List -->
        <div class="w-full md:w-1/4 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center">
            <h2 class="text-lg font-bold mb-2 text-center text-cyan-400">สแกนเพื่อเข้าร่วม</h2>
            <div id="qrcode" class="bg-white p-3 rounded-lg shadow-md mb-4"></div>
            
            <h3 class="font-semibold text-slate-300 w-full border-b border-slate-600 pb-1 mb-2">
                ตัวละครในสนาม (<span id="player-count">0</span>)
            </h3>
            <ul id="player-join-list" class="w-full flex-1 overflow-y-auto space-y-2 text-sm">
                <li class="text-slate-500 text-center italic py-4">กำลังรอผู้เล่นสแกน...</li>
            </ul>
        </div>

        <!-- Main Sky Arena View -->
        <div class="flex-1 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-bold text-slate-200">ลานประลองสีฟ้าอ่อน</h2>
            </div>

            <!-- Light Blue 2D Arena Canvas Box -->
            <div id="arena-container" class="flex-1 arena-sky rounded-xl relative border-4 border-sky-400 shadow-inner overflow-hidden min-h-[450px]">
                <div id="players-layer" class="w-full h-full relative">
                    <!-- Dynamic player avatars render here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://multiplayer-math-game-e021c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multiplayer-math-game-e021c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playersData = {};
        const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4', '#10B981'];

        // QR Code pointing directly to player.html
        const playerUrl = "https://newlifespc-a11y.github.io/multiplayer-math-game/find-number/player.html";
        new QRCode(document.getElementById("qrcode"), {
            text: playerUrl,
            width: 140,
            height: 140
        });

        // Sync Players Position Realtime
        db.ref('players').on('value', (snapshot) => {
            playersData = snapshot.val() || {};
            renderArena();
            updateJoinList();
        });

        function updateJoinList() {
            const listEl = document.getElementById('player-join-list');
            const countEl = document.getElementById('player-count');
            const keys = Object.keys(playersData);
            countEl.innerText = keys.length;

            if (keys.length === 0) {
                listEl.innerHTML = '<li class="text-slate-500 text-center italic py-4">กำลังรอผู้เล่นสแกน...</li>';
                return;
            }

            listEl.innerHTML = keys.map((id, index) => {
                const p = playersData[id];
                const color = colors[index % colors.length];
                return `<li class="flex items-center justify-between bg-slate-700/50 p-2 rounded border border-slate-600">
                    <span class="font-medium flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${color}"></span>
                        ${p.name}
                    </span>
                    <span class="text-xs text-sky-300">x: ${Math.round(p.x)}%, y: ${Math.round(p.y)}%</span>
                </li>`;
            }).join('');
        }

        function renderArena() {
            const container = document.getElementById('players-layer');
            const keys = Object.keys(playersData);

            if (keys.length === 0) {
                container.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-slate-600 font-bold text-lg">ยังไม่มีผู้เล่นในสนาม (สแกน QR Code เพื่อเข้ามาได้เลย)</div>';
                return;
            }

            container.innerHTML = keys.map((id, index) => {
                const p = playersData[id];
                const color = colors[index % colors.length];
                const x = p.x !== undefined ? p.x : 50;
                const y = p.y !== undefined ? p.y : 50;

                return `
                <div class="absolute transition-all duration-75 ease-out flex flex-col items-center transform -translate-x-1/2 -translate-y-1/2" 
                     style="left: ${x}%; top: ${y}%;">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-md border-2 border-white ring-2 ring-sky-600/30" 
                         style="background-color: ${color}">
                        🏃
                    </div>
                    <span class="mt-1 text-[11px] font-bold bg-slate-900/80 text-white px-2 py-0.5 rounded shadow border border-slate-700 whitespace-nowrap">
                        ${p.name}
                    </span>
                </div>`;
            }).join('');
        }

        function resetGame() {
            if (confirm("ต้องการลบผู้เล่นทั้งหมดออกจากสนามใช่หรือไม่?")) {
                db.ref('players').set({});
            }
        }
    </script>
</body>
</html>
