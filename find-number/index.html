<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Runner - Host Display</title>
    <!-- Tailwind CSS สำหรับจัดสไตล์ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js สำหรับสร้าง QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .track { background: repeating-linear-gradient(90deg, #374151, #374151 20px, #4B5563 20px, #4B5563 40px); }
        .finish-line { background: repeating-linear-gradient(45deg, #000, #000 10px, #fff 10px, #fff 20px); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="p-4 bg-slate-800 flex justify-between items-center border-b border-slate-700">
        <div>
            <h1 class="text-2xl font-bold text-yellow-400">🏃 Math Runner Grand Prix</h1>
            <p class="text-xs text-slate-400">สแกน QR Code บนมือถือเพื่อเข้าร่วมการแข่งขัน!</p>
        </div>
        <div class="flex items-center space-x-4">
            <button id="start-btn" onclick="startGame()" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2 rounded-lg font-bold text-white shadow-lg transition">เริ่มเกม!</button>
            <button onclick="resetGame()" class="bg-rose-600 hover:bg-rose-700 px-4 py-2 rounded-lg font-bold text-white shadow transition text-sm">รีเซ็ตระบบ</button>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row p-4 gap-4">
        <!-- Sidebar: QR Code & Player Join List -->
        <div class="w-full md:w-1/4 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center">
            <h2 class="text-lg font-bold mb-2 text-center text-cyan-400">สแกนเพื่อเล่นเกม</h2>
            <div id="qrcode" class="bg-white p-3 rounded-lg shadow-md mb-4"></div>
            
            <h3 class="font-semibold text-slate-300 w-full border-b border-slate-600 pb-1 mb-2">
                ผู้เล่นที่พร้อมแล้ว (<span id="player-count">0</span>)
            </h3>
            <ul id="player-join-list" class="w-full flex-1 overflow-y-auto space-y-2 text-sm">
                <li class="text-slate-500 text-center italic py-4">กำลังรอผู้เล่นเข้าร่วม...</li>
            </ul>
        </div>

        <!-- Main Racing Track View -->
        <div class="flex-1 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-200">ลานประลองความเร็ว</h2>
                <span id="game-status" class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-semibold">สถานะ: รอเริ่มต้น</span>
            </div>

            <!-- Race Track Container -->
            <div id="track-container" class="flex-1 track rounded-lg p-4 relative overflow-y-auto border-2 border-slate-600 flex flex-col gap-3">
                <!-- Finish Line -->
                <div class="finish-line absolute top-0 bottom-0 right-12 w-6 z-10 shadow-lg opacity-80"></div>
                <div id="players-tracks" class="w-full h-full flex flex-col justify-around gap-2 z-20">
                    <!-- Dynamic player tracks will render here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Script & App Logic -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://multiplayer-math-game-e021c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multiplayer-math-game-e021c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playersData = {};
        const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4', '#10B981'];

        // Generate QR Code dynamically targeting player.html
        const playerUrl = window.location.href.replace('index.html', 'player.html');
        new QRCode(document.getElementById("qrcode"), {
            text: playerUrl,
            width: 140,
            height: 140
        });

        // Listen for Realtime Player Updates
        db.ref('players').on('value', (snapshot) => {
            playersData = snapshot.val() || {};
            renderTracks();
            updateJoinList();
        });

        function updateJoinList() {
            const listEl = document.getElementById('player-join-list');
            const countEl = document.getElementById('player-count');
            const keys = Object.keys(playersData);
            countEl.innerText = keys.length;

            if (keys.length === 0) {
                listEl.innerHTML = '<li class="text-slate-500 text-center italic py-4">กำลังรอผู้เล่นเข้าร่วม...</li>';
                return;
            }

            listEl.innerHTML = keys.map((id, index) => {
                const p = playersData[id];
                const color = colors[index % colors.length];
                return `<li class="flex items-center justify-between bg-slate-700/50 p-2 rounded border border-slate-600">
                    <span class="font-medium flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${color}"></span>
                        ${p.name}
                    </span>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">คะแนน: ${p.score || 0}</span>
                </li>`;
            }).join('');
        }

        function renderTracks() {
            const container = document.getElementById('players-tracks');
            const keys = Object.keys(playersData);

            if (keys.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 m-auto font-semibold">ยังไม่มีผู้เล่นอยู่ในสนาม</div>';
                return;
            }

            container.innerHTML = keys.map((id, index) => {
                const p = playersData[id];
                const color = colors[index % colors.length];
                const score = p.score || 0;
                // Maximum 10 points to reach the finish line (90% width)
                const positionPercent = Math.min((score / 10) * 85, 85);

                return `
                <div class="relative w-full h-12 bg-slate-800/80 rounded-lg border border-slate-600 flex items-center px-2">
                    <div class="absolute left-0 top-0 bottom-0 bg-slate-700/30 rounded-lg" style="width: ${positionPercent + 5}%"></div>
                    <div class="absolute transition-all duration-500 ease-out flex items-center gap-2" style="left: ${positionPercent}%">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-md" style="background-color: ${color}">
                            🏃
                        </div>
                        <span class="text-xs font-bold bg-slate-900/90 text-white px-2 py-0.5 rounded shadow border border-slate-700 whitespace-nowrap">
                            ${p.name} (${score})
                        </span>
                    </div>
                </div>`;
            }).join('');
        }

        function startGame() {
            db.ref('gameState').set({ status: 'PLAYING', timestamp: Date.now() });
            document.getElementById('game-status').innerText = 'สถานะ: กำลังแข่งขัน 🔥';
            document.getElementById('game-status').className = 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-semibold';
        }

        function resetGame() {
            if (confirm("ต้องการลบข้อมูลผู้เล่นและรีเซ็ตเกมใช่หรือไม่?")) {
                db.ref().set({
                    players: {},
                    gameState: { status: 'WAITING' }
                });
                document.getElementById('game-status').innerText = 'สถานะ: รอเริ่มต้น';
                document.getElementById('game-status').className = 'bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-semibold';
            }
        }
    </script>
</body>
</html>
